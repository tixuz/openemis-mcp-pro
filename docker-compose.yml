services:
  openemis-mcp-pro:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # bind to loopback only — Cloudflare Tunnel reaches it, public internet cannot
    env_file:
      - .env
    environment:
      OPENEMIS_TRANSPORT: "http"
      OPENEMIS_PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
